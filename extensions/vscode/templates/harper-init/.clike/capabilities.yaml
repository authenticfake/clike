# CLike project-local capability configuration.
#
# This file is intentionally lightweight.
# The actual capability content lives under:
# - .clike/skills/*/SKILL.md
# - .clike/packs/*/PACK.md
# - .clike/design-profiles/*/DESIGN.md
#
# CLike discovers those folders from the active workspace.

version: 1

defaults:
  enabled: true
  discovery:
    skills: ".clike/skills"
    packs: ".clike/packs"
    design_profiles: ".clike/design-profiles"

policy:
  agent_agnostic: true
  model_agnostic: true
  language_agnostic: true
  domain_agnostic: true
  require_verifiable_capabilities: true
  external_plugins_enabled: false
  external_plugins_require_human_approval: true

notes:
 notes:
  - "Workspace capabilities override built-in templates."
  - "Capabilities guide IDEA, SPEC, PLAN, KIT, EVAL, GATE, and FINALIZE."
  - "Capabilities do not override SPEC, TECH_CONSTRAINTS, repository evidence, or explicit user instructions."
  - "Prefer reuse-before-create, patch-before-rewrite, and complete-before-regenerate."
  - "A code project is not final until it has a verifiable local run/check path or an explicit documented reason why local run is not applicable."
  - "Selected skills, packs, and design profiles must be treated as testable obligations, not decorative labels."