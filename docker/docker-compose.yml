# CLike local stack — Podman (`podman-compose`) or Docker Compose.
#
#   cp docker/.env.example docker/.env   # set CLIKE_PROJECTS_DIR once
#   cd docker && podman-compose up -d --build
#   cd docker && podman-compose --profile ollama up -d   # optional local models
#
# Ports are published on loopback only (localhost deployment, decision D2).
# Code is baked into the images: rebuild after changes (`podman-compose build`).

services:
  gateway:
    build: ../gateway
    environment:
      - MODELS_CONFIG=/workspace/configs/models.yaml
      - HARPER_TELEMETRY_DIR=/workspace/telemetry
      - HARPER_STUB_DIR=/workspace/gateway/stub
      - GATEWAY_DUMP_DIR=/app/runs/gateway_dumps
      - RAG_TOP_K=12
      - TIMEOUT=700.0
      - DEV_FOLDER=${CLIKE_PROJECTS_DIR:?set CLIKE_PROJECTS_DIR in docker/.env}
      - RAG_BASE_URL=http://orchestrator:8080/v1/rag
      - OLLAMA_BASE_URL=http://ollama:11434
      - TZ=Europe/Rome
      - EMBEDDING_DIM=1536
      - RAG_EMBED_FAMILY=openai_1536
      - RAG_EMBED_MODEL=openai:text-embedding-3-small
      - RAG_SCORE_THRESHOLD=0.30
    env_file:
      - path: ../.env
    # Minimal mounts (WP4): no write access to the CLike repo or its .git.
    volumes:
      - ../configs:/workspace/configs:ro
      - ../telemetry:/workspace/telemetry
      - ../gateway/stub:/workspace/gateway/stub:ro
      - ${CLIKE_PROJECTS_DIR}:${CLIKE_PROJECTS_DIR}:ro
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12

  orchestrator:
    build: ../orchestrator
    environment:
      - TZ=Europe/Rome
      - GATEWAY_URL=http://gateway:8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # tool toggles
      - CLIKE_TOOLS_PY_BLACK=true
      - CLIKE_TOOLS_PY_ISORT=true
      - CLIKE_TOOLS_PY_RUFF=true
      - CLIKE_TOOLS_TS_PRETTIER=true
      - CLIKE_TOOLS_TS_ESLINT=false
      - CLIKE_TOOLS_JAVA_GJF=true
      - CLIKE_TOOLS_GO_FMT=true
      - CLIKE_TOOLS_GO_IMPORTS=true
      - RUNS_DIR=/runs
      - WORKSPACE_ROOT=/workspace/
      - CODE_ROOT_BASE=src
      - TEST_ROOT_BASE=tests
      - GEN_ID_PREFIX=generated
      - ENSURE_MIN_TESTS=true
      - SPLIT_ENABLE_PY=true
      - SPLIT_ENABLE_TS=true
      - SPLIT_ENABLE_GO=true
      - SPLIT_ENABLE_JAVA=true
      - SPLIT_ENABLE_REACT=true
      - SPLIT_ENABLE_MENDIX=false
      - PREFER_FRONTIER_FOR_REASONING=true
      - MODELS_PATH=/workspace/configs/models.yaml
      - OPTIMIZE_FOR=capability
      - GENERATED_ROOT=/generated
      - RAG_BASE_URL=http://localhost:8080/v1/rag
      - RAG_TOP_K=12
      - INLINE_MAX_FILE_KB=64
      - INLINE_MAX_TOTAL_KB=256
      - RAG_SIZE_THRESHOLD_KB=64
      - TIMEOUT=720.0
      - DEV_FOLDER=${CLIKE_PROJECTS_DIR:?set CLIKE_PROJECTS_DIR in docker/.env}
      - EMBEDDING_DIM=1536
      - RAG_EMBED_FAMILY=openai_1536
      - RAG_EMBED_MODEL=openai:text-embedding-3-small
      - RAG_SCORE_THRESHOLD=0.30
      - CLIKE_MCP_SERVER_ENABLED=true
    env_file:
      - path: ../.env
    # Minimal mounts (WP4): the CLike repo (including .git) is read-only, so eval
    # commands generated by an LLM cannot plant git hooks or edit sources on the
    # host. Only the generated-code dirs used by /v1/generate are writable.
    volumes:
      - ..:/workspace:ro
      - ../src:/workspace/src
      - ../tests:/workspace/tests
      - ../configs:/workspace/configs:ro
      - ./runs:/app/runs
      - ${CLIKE_PROJECTS_DIR}:${CLIKE_PROJECTS_DIR}:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      gateway:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage

  # Optional local models (decision D3): kept as an interface, off by default.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["127.0.0.1:11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: curlimages/curl:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      '
      set -e;
      echo "[ollama-init] checking installed models...";
      TAGS_JSON="$(curl -fsS http://ollama:11434/api/tags)";
      echo "$TAGS_JSON" | grep -q "\"name\":\"nomic-embed-text\"" && {
        echo "[ollama-init] nomic-embed-text already present";
        exit 0;
      };
      echo "[ollama-init] pulling nomic-embed-text...";
      curl -fsS http://ollama:11434/api/pull -d "{\"name\":\"nomic-embed-text\"}";
      echo "[ollama-init] done";
      '
    restart: "no"

volumes:
  qdrant_data:
  ollama_data:
