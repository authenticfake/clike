defaults:
  chat_model: gpt-4o-mini
  embedding_model: nomic-embed-text

models:
  - id: ollama:llama3
    name: llama3
    provider: ollama
    base_url: http://ollama:11434
    remote_name: llama3
    modality: chat
    capability: medium
    latency: low
    cost: low
    privacy: high
    enabled: true
    temperature: 0.2
    tags: [local, fast, coding]

  - id: ollama:nomic-embed-text
    name: nomic-embed-text
    provider: ollama
    base_url: http://ollama:11434
    remote_name: nomic-embed-text
    modality: embeddings
    capability: medium
    latency: low
    cost: low
    privacy: high
    enabled: true
    temperature: 0.2
    tags: [embeddings, local]

  - id: vllm:deepseek-coder-v2
    name: deepseek-coder-v2
    provider: vllm
    base_url: http://vllm:8000/v1
    remote_name: deepseek-coder-v2
    modality: chat
    capability: high
    latency: medium
    cost: low
    privacy: high
    enabled: false
    temperature: 0.2
    tags: [local, fast, coding]

  - id: deepseek:deepseek-chat
    name: deepseek-chat
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    remote_name: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    modality: chat
    capability: high
    latency: medium
    cost: medium
    privacy: low
    enabled: false
    temperature: 0.4
    tags: [cheap]

  - id: openai:gpt-4o-mini
    name: gpt-4o-mini
    provider: openai
    base_url: https://api.openai.com/v1
    remote_name: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    modality: chat
    capability: high
    latency: medium
    cost: low
    privacy: low
    enabled: true
    temperature: 0.2
    tags: [cheap, fast]

  - id: openai:gpt-4o
    name: gpt-4o
    provider: openai
    base_url: https://api.openai.com/v1
    remote_name: gpt-4o
    api_key_env: OPENAI_API_KEY
    modality: chat
    capability: high
    latency: medium
    cost: medium
    privacy: low
    enabled: true
    temperature: 0.2
    tags: [quality]

  - id: openai:gpt-5
    name: gpt-5
    provider: openai
    base_url: https://api.openai.com/v1
    remote_name: gpt-5
    modality: responses
    capability: frontier
    latency: medium
    cost: high
    temperature: 0.1
    tags: [frontier, quality, reasoning]
    enabled: true
    api_key_env: OPENAI_API_KEY

  - id: openai:text-embedding-3-small
    name: text-embedding-3-small
    provider: openai
    base_url: https://api.openai.com/v1
    remote_name: text-embedding-3-small
    api_key_env: OPENAI_API_KEY
    modality: embeddings
    capability: high
    latency: medium
    cost: medium
    privacy: low
    enabled: false

  - id: anthropic:claude-haiku-4-5
    name: claude-haiku-4-5
    provider: anthropic
    base_url: https://api.anthropic.com/v1
    remote_name: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    modality: chat
    capability: medium
    latency: low
    cost: low
    privacy: low
    enabled: true
    tags: [cheap, fast]

profiles:
  plan.fast:
    model: openai:gpt-4o-mini
    select:
      any_tags: [fast]
      prefer_providers: [openai, anthropic]

  code.strict:
    model: openai:gpt-5
    select:
      any_tags: [quality]

  chat.cheap:
    model: anthropic:claude-haiku-4-5
    select:
      any_tags: [cheap]

  local.codegen:
    model: ollama:llama3
    select:
      any_tags: [local, coding]

routing:
  spec: plan.fast
  plan: plan.fast
  kit: code.strict
  build: local.codegen
  chat: chat.cheap

scoring:
  weights:
    capability: 0.5
    latency: 0.2
    cost: 0.2
    quality: 0.1