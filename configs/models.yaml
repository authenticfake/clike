profiles:
  plan.fast:
    model: openai:gpt-5.4-mini
    select:
      any_tags: [reasoning]
      prefer_providers: [openai, anthropic]

  code.strict:
    model: openai:gpt-5.1-codex-max
    select:
      any_tags: [code, quality]
      avoid_tags: [cheap]

  chat.cheap:
    model: anthropic:claude-haiku-4-5
    select:
      any_tags: [cheap]

  local.codegen:
    model: ollama:llama4
    select:
      any_tags: [local, coding]

  cloud.codegen:
    model: deepseek:deepseek-coder-v2
    select:
      any_tags: [coding]

routing:
  idea: plan.fast
  spec: plan.fast
  plan: plan.fast
  kit: code.strict
  build: code.strict
  finalize: local.codegen
  chat: chat.cheap

scoring:
  weights:
    capability: 0.45  # frontier > large > medium > small > tiny
    latency: 0.20     # ultra-low > low > medium > high
    cost: 0.20        # ultra-low > low > medium > high
    privacy: 0.05    
    quality: 0.10    # +1 se tag quality/frontier, -1 se cheap
