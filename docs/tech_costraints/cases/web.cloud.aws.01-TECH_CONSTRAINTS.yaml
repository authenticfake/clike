tech_constraints:
  version: 1.0.0
  metadata:
    name: "AWS Web Application - Multi-tier (simple)"
    description: "Autogenerated TECH_CONSTRAINTS example."
    owner: "clike-demo"
    environment: [dev, qa, prod]
    criticality: medium
    complexity: medium
    domain: "demo"
    compliance: ["GDPR"]
  classification:
    solution_type: "web"
    location: "cloud"
    cloud_provider: "aws"
    tenant_model: "single"
    data_sensitivity: "internal"
  project_definition:
    type: "web_application"
    framework: "nextjs"
    language: "typescript"
    deployment_target: "aws"
  technology_stack:
    core:
      framework: "Next.js 14"
      language: "TypeScript"
      runtime: "Node.js"
  lanes:
    - name: "default"
      lane: "js-ts"
      purpose: "demo lane"
      allowed_frameworks: ["Next.js"]
      forbidden_technologies: ["jQuery"]
      default_test_profile:
        coverage_min: 70
        required_checks: [tests, lint, build]
  profiles:
    - name: "default-profile"
      runtime: "node@20"
      platform: "aws"
      api: ["rest"]
      storage: ["postgres"]
      messaging: []
      auth: ["none"]
      observability: []
  capabilities:
    - type: "ci.quality"
      coverage_min: 70
      require_sast: false
      require_sca: false
  ci_cd:
    system: "github_actions"
    runners: "ubuntu-latest"
    pipelines:
      main_branch: ".github/workflows/ci.yml"
  security:
    internet_egress: "allowed"
    allowed_endpoints: ["*"]
    secrets_management: "env"
    dependency_policy:
      allowlist: ["next", "react"]
  data_management:
    primary_stores:
      - name: "db"
        engine: "postgres"
    backup_policy:
      rpo_minutes: 60
      rto_minutes: 120
  eval_profiles:
    default:
      coverage_min: 70
      max_critical_vulns: 0
      lint_must_be_clean: true
