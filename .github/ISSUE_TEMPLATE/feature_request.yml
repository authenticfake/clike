name: Feature request
description: Propose an improvement to CLike
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or questions, a [Discussion](https://github.com/authenticfake/clike/discussions)
        is often a better start.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with CLike
      options:
        - label: It works the same for cloud models, Claude Code and Codex (or I explain why not).
        - label: It is generic — not tied to one language, stack or project.
