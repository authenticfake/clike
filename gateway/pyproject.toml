[project]
name = "clike-gateway"
version = "1.2.1"
description = "CLike model Gateway: provider abstraction, Harper prompt composition, telemetry"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.0",
    "PyYAML==6.0.2",
    # attachment/document extraction
    "pdfminer.six==20221105",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "python-pptx==0.6.23",
    "xlrd==2.0.1",
    "pyxlsb==1.0.10",
]

[project.optional-dependencies]
# Optional Claude Agent SDK path in providers/anthropic.py (lazy import).
claude-agent = ["claude-agent-sdk"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
